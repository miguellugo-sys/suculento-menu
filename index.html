<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú | Suculento Ramen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b3a73;--red:#f03c05;--orange:#f46a0a;--cream:#ffffff;--paper:#fffaf2;--ink:#2a2118;--muted:#6f6254}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.45 "DM Sans",system-ui,sans-serif}
header{text-align:center;padding:28px 16px 12px}
header img{width:min(280px,70%);height:auto}
.hours{margin:10px auto 0;max-width:420px;font-size:14px;color:var(--muted)}
.hours b{color:var(--navy);font-weight:500}
nav{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:2px solid var(--navy);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav a{flex:none;padding:7px 14px;border-radius:99px;border:2px solid var(--navy);color:var(--navy);text-decoration:none;font:600 14px "Montserrat",sans-serif}
nav a.on{background:var(--navy);color:var(--cream)}
main{max-width:720px;margin:0 auto;padding:0 16px 40px}
h2{margin:36px 0 6px;font:800 30px/1 "Montserrat",sans-serif;color:var(--red)}
.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px dashed #e2d8c8}
.item img{flex:none;width:96px;height:96px;object-fit:cover;border-radius:12px;border:2px solid var(--navy)}
.body{flex:1;min-width:0}
.item h3{margin:0;font:800 17px/1.2 "Montserrat",sans-serif;color:var(--navy)}
.item p{margin:4px 0 8px;font-size:14px;color:var(--muted)}
.pr{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:500}
.pr span{white-space:nowrap}
.pr em{font-style:normal;color:var(--muted);font-size:14px}
.pr b{color:var(--red);font:800 16px "Montserrat",sans-serif}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--orange);color:#fff;font:600 11px "DM Sans",sans-serif;vertical-align:middle}
.off{opacity:.45}
footer{background:var(--navy);color:var(--cream);text-align:center;padding:24px 16px;font-size:14px}
footer a{color:#fff;font-weight:500}
footer p{margin:4px 0}
@media(max-width:380px){.item img{width:78px;height:78px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
<img src="img/logo.png" alt="Suculento Ramen">
<div class="hours" id="hours"></div>
</header>
<nav id="nav" aria-label="Categorías"></nav>
<main id="menu"><p>Cargando menú…</p></main>
<footer id="foot"></footer>
<script>
const $=id=>document.getElementById(id);
const money=n=>'$'+n;
fetch('menu.json?v='+Date.now()).then(r=>r.json()).then(m=>{
  $('hours').innerHTML=m.horario.map(h=>`<div><b>${h[0]}:</b> ${h[1]}</div>`).join('');
  $('nav').innerHTML=m.categorias.map(c=>`<a href="#${c.id}">${c.nombre}</a>`).join('');
  $('menu').innerHTML=m.categorias.map(c=>`<section id="${c.id}"><h2>${c.nombre}</h2>`+c.items.map(i=>`
    <article class="item${i.off?' off':''}">
      ${i.img?`<img src="img/${i.img}.jpg" alt="${i.n}" loading="lazy">`:''}
      <div class="body">
        <h3>${i.n}${i.a?'<span class="tag" title="Contiene alérgenos">Alérgenos</span>':''}${i.off?'<span class="tag">Agotado</span>':''}</h3>
        <p>${i.d||''}</p>
        <div class="pr">${i.p.map(p=>`<span>${p[0]?`<em>${p[0]}</em> `:''}<b>${money(p[1])}</b></span>`).join('')}</div>
      </div></article>`).join('')+'</section>').join('');
  $('foot').innerHTML=m.notas.map(n=>`<p>${n}</p>`).join('')+
    `<p><a href="https://instagram.com/${m.ig}">@${m.ig}</a> · <a href="https://wa.me/52${m.tel}">WhatsApp ${m.tel.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3')}</a></p>`;
  const links=[...document.querySelectorAll('nav a')],secs=m.categorias.map(c=>$(c.id));
  new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('on',l.hash==='#'+e.target.id))}),{rootMargin:'-20% 0px -70% 0px'}).observe&&secs.forEach(s=>new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('on',l.hash==='#'+e.target.id))}),{rootMargin:'-20% 0px -70% 0px'}).observe(s));
}).catch(()=>{$('menu').innerHTML='<p>No se pudo cargar el menú. Intenta de nuevo en un momento.</p>'});
</script>
</body>
</html>
